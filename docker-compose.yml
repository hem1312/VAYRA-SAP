# Optional: Qdrant vector database for the SAP RAG layer.
#
# Ollama stays a native Windows service (it manages local models/GPU), so only
# Qdrant is containerized. This file is OPTIONAL: without it the backend falls
# back automatically to a persistent local Qdrant store in backend/.qdrant_local.
#
# Start:   docker compose up -d
# Stop:    docker compose down        (data persists in the named volume)
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: vayra-qdrant
    ports:
      - "6333:6333" # HTTP API (QDRANT_URL)
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
